<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRC agent pathway — whiteboard explainer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #141618; color: #f3efe6; }
  #stage { position: fixed; inset: 0 0 72px 0; display: grid; place-items: center; }
  #stage.drop { outline: 3px dashed #1f4fc2; outline-offset: -8px; }
  canvas { width: 100%; height: 100%; object-fit: contain; background: #141618; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 72px;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: #0e1012; font: 16px/1.2 ui-sans-serif, system-ui, sans-serif;
  }
  button, .file {
    background: #f3efe6; color: #1d1f26; border: 0; border-radius: 6px;
    min-height: 40px; padding: 0 12px; font: inherit; cursor: pointer;
  }
  button[aria-pressed="true"] { background: #1f4fc2; color: white; }
  #scrub { flex: 1; min-width: 80px; height: 28px; }
  #time { font-variant-numeric: tabular-nums; min-width: 7.2ch; }
  .file input { display: none; }
  #vname { max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.8; }
  label.loop { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1280" height="720" aria-label="Whiteboard explainer"></canvas>
</div>
<div id="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="70.6" step="0.01" value="0" aria-label="Time">
  <span id="time">0:00.00</span>
  <button id="sound" type="button" aria-pressed="true">Sound on</button>
  <label class="loop"><input id="loop" type="checkbox" checked> Loop</label>
  <label class="file">Load voiceover<input id="file" type="file" accept="audio/*"></label>
  <span id="vname"></span>
</div>
<script>
/* H helper library, unchanged from the style guide. */
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();

// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      error: (t, o) => { tone(t, { f: o.f || 'A3', type: 'square', dur: 0.13, gain: 0.09 * o.g, hold: 0.08, filter: 'lowpass', f2: 1400, pan: o.pan }); tone(t + 0.15, { f: hz(o.f || 'A3') * 0.8, type: 'square', dur: 0.22, gain: 0.09 * o.g, hold: 0.14, filter: 'lowpass', f2: 1200, pan: o.pan }); },
      buzz: (t, o) => { const d = o.dur || 0.3; tone(t, { f: o.f || 110, type: 'sawtooth', dur: d, gain: 0.12 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); tone(t, { f: (o.f || 110) * 1.01, type: 'sawtooth', dur: d, gain: 0.1 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); },

      const c = H.layer(1280, 720), g = c.getContext('2d');
      const prev = INK;
      INK = '#30343c';
      drawFn(g, tFreeze);
      INK = prev;
      TIP = null;
      applyWipe(g, 1);
      haze(g);
      XC[key] = c;
    }
    return XC[key];
  }
  function place(ctx, er, drawFn, t) {
    if (t < er.t0) { drawFn(ctx, t); return; }
    const ghostA = 0.32;
    if (t < er.t1) {
      const u = (t - er.t0) / (er.t1 - er.t0);
      const layer = wipeLayer();
      drawFn(layer.getContext('2d'), er.t0);
      const pt = applyWipe(layer.getContext('2d'), u);
      ERASER = pt;
      ctx.save();
      ctx.globalAlpha *= u < 0.78 ? 1 : 1 - (u - 0.78) / 0.22;
      ctx.drawImage(layer, 0, 0);
      ctx.restore();
      if (u > 0.78) {
        ctx.save();
        ctx.globalAlpha *= ghostA * (u - 0.78) / 0.22;
        ctx.drawImage(residue(er.id, drawFn, er.t0), 0, 0);
        ctx.restore();
      }
      return;
    }
    ctx.save();
    ctx.globalAlpha *= ghostA;
    ctx.drawImage(residue(er.id, drawFn, er.t0), 0, 0);
    ctx.restore();
  }

  function explainer(ctx, W, H_, t) {
    TIP = null; ERASER = null; INK = null;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.drawImage(boardCache(), 0, 0);
    ctx.save();
    ctx.beginPath(); ctx.rect(26, 26, W - 52, 624); ctx.clip();
    place(ctx, ERASE[0], drawA, t);
    place(ctx, ERASE[1], drawB, t);
    place(ctx, ERASE[2], drawC, t);
    if (t >= BEATS[6].t0 - 0.05) drawD(ctx, t);
    drawSRC(ctx, t);
    drawFooter(ctx, t);
    ctx.restore();
    sheen(ctx, W, H_, t);
    if (ERASER) drawEraser(ctx, ERASER[0], ERASER[1]);
    else if (TIP) drawHand(ctx, TIP[0], TIP[1], TIP[2]);
    ctx.drawImage(frameCache(), 0, 0);
    H.grain(ctx, W, H_, 0.018, 9 + (Math.floor(t * 12) % 5));
  }

  function scoreSound(k) {
    const mk = (a, b, gain, pan, material, minor) => {
      gain = gain == null ? 1 : gain;
      pan = pan || 0;
      if (b < a + 0.045) b = a + 0.045;
      const minorFlag = minor !== false;
      k.noise(a, { dur: 0.018, filter: 'bandpass', f: 1500, q: 1.4, gain: 0.18 * gain, a: 0.001, pan, minor: minorFlag });
      k.play('stroke', a, { material: material || 'marker', dur: b - a, gain, pan, minor: minorFlag });
    };
    const word = (n, w, nth, dur, gain, pan, minor) => mk(land(n, w, nth), land(n, w, nth) + (dur || 0.38), gain, pan, 'marker', minor);

    k.play('pop', 0.04, { f: 330, gain: 0.45, minor: true });
    mk(0.1, 0.55, 0.7, -0.3);
    word(1, 'chatbot', 0, 0.75, 0.95, -0.2);
    word(1, 'reply', 0, 0.5, 0.85, -0.1);
    mk(said(1, 'reply') + 0.15, land(1, 'agent'), 0.8, 0);
    word(1, 'agent', 0, 0.6, 1.0, 0.15, false);
    word(1, 'gets', 0, 0.3, 0.6, 0.1);
    word(1, 'the', 0, 0.28, 0.6, 0.12);
    word(1, 'job', 0, 0.4, 1.05, 0.15, false);
    k.play('pop', said(1, 'job'), { f: 520, gain: 0.55 });

    k.play('swish', M12[0], { dur: M12[1] - M12[0], gain: 0.32, minor: true });
    word(2, 'instructions', 0, 0.5, 0.85, -0.2);
    word(2, 'knowledge', 0, 0.48, 0.85, 0);
    word(2, 'task', 0, 0.48, 0.85, 0.2);
    word(2, 'acts', 0, 0.5, 1.1, 0.25, false);
    k.play('pop', said(2, 'acts'), { f: 660, gain: 0.4, minor: true });

    ERASE.forEach((er) => {
      k.play('erase', er.t0, { dur: er.t1 - er.t0, gain: 0.62 });
    });

    word(3, 'Level', 0, 0.55, 1.0, -0.15, false);
    word(3, 'Award', 0, 0.35, 0.7, -0.1);
    word(3, 'Business', 0, 0.45, 0.7, 0.1);
    word(3, 'AI', 0, 0.7, 0.9, 0.15);
    mk(findWord(3, 'Agents').end, findWord(3, 'Agents').end + 0.4, 0.75, 0.1);
    k.play('tock', said(3, 'Seventeen'), { f: 540, gain: 0.85 });
    word(3, 'weeks', 0, 0.3, 0.6, -0.05);
    word(3, 'Tuesday', 0, 0.4, 0.75, 0);
    word(3, 'eCampus', 0, 0.4, 0.8, 0.1);

    k.play('swish', M34[0], { dur: 0.4, gain: 0.28, minor: true });
    word(4, 'build', 0, 0.45, 0.9, -0.25);
    word(4, 'Copilot', 0, 0.4, 0.75, -0.15);
    word(4, 'test', 0, 0.4, 0.8, -0.05);
    word(4, 'refine', 0, 0.4, 0.8, 0.08);
    word(4, 'share', 0, 0.4, 0.85, 0.18);
    word(4, 'Teams', 0, 0.35, 1.15, 0.25, false);
    k.play('stamp', said(4, 'Teams'), { gain: 0.8 });

    k.play('swish', M45[0], { dur: 0.4, gain: 0.28, minor: true });
    word(5, 'inbox', 0, 0.5, 0.8, -0.25);
    word(5, 'spreadsheet', 0, 0.5, 0.8, -0.05);
    word(5, 'reply', 0, 0.5, 0.8, 0.1);
    mk(land(5, 'check'), land(5, 'check') + 0.5, 1.35, 0.25, 'sharpie', false);
    k.play('tick', said(5, 'check'), { f: 2400, gain: 0.7 });

    word(6, 'rule', 0, 0.4, 0.9, 0, false);
    word(6, 'only', 0, 0.7, 0.85, -0.05);
    word(6, 'see', 0, 0.65, 0.85, 0.05);
    mk(land(6, 'permission'), land(6, 'permission') + 0.4, 1.2, 0, 'sharpie', false);
    k.play('impact', said(6, 'permission'), { gain: 0.82 });
    mk(BEATS[5].t1 - 0.55, BEATS[5].t1 - 0.15, 0.6, 0.15);

    word(7, 'Level', 0, 0.5, 1.0, -0.1, false);
    word(7, 'Machine', 0, 0.55, 0.85, 0.1);
    k.play('tock', said(7, 'Sixteen'), { f: 500, gain: 0.8 });
    word(7, 'Models', 0, 0.35, 0.65, -0.1);
    word(7, 'vision', 0, 0.32, 0.65, 0.15);
    word(7, 'chat', 0, 0.32, 0.65, -0.05);
    word(7, 'responsible', 0, 0.4, 0.75, 0.15);

    k.play('swish', M78[0], { dur: 0.35, gain: 0.25, minor: true });
    word(8, 'Level', 0, 0.4, 0.8, -0.2);
    k.play('tock', said(8, 'eighteen'), { f: 460, gain: 0.6 });
    word(8, 'English', 0, 0.35, 0.6, -0.1);
    word(8, 'Maths', 0, 0.35, 0.6, 0);
    word(8, 'previous', 0, 0.4, 0.7, -0.15);
    word(8, 'Level', 1, 0.4, 0.8, 0.2);
    word(8, 'related', 0, 0.4, 0.7, 0.15);
    word(8, 'experience', 0, 0.4, 0.7, 0.18);
    k.play('impact', said(8, 'fee'), { gain: 0.9 });
    mk(land(8, 'fee'), land(8, 'fee') + 0.35, 1.0, -0.1, 'marker', false);
    word(8, 'Portfolio', 0, 0.4, 0.75, 0.05);
    mk(land(8, 'exam'), land(8, 'exam') + 0.35, 1.05, 0.2, 'marker', false);
    k.play('tock', said(8, 'exam'), { f: 700, gain: 0.55 });

    k.play('swish', M89[0], { dur: 0.45, gain: 0.3, minor: true });
    mk(M89[0] + 0.2, M89[0] + 0.65, 0.85, 0);
    word(9, 'Build', 0, 0.6, 1.0, 0, false);
    word(9, 'learn', 0, 0.6, 0.95, 0.05);
    mk(BEATS[8].t1 - 0.12, BEATS[8].t1 + 0.18, 1.15, 0, 'marker', false);
    k.play('success', BEATS[8].t1 + 0.02, { f: 'G5', gain: 0.78 });
    k.play('click', DURATION - 0.35, { f: 1300, gain: 0.55, minor: true });
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const W = 1280, H_ = 720;
  let t = 0, playing = false, last = 0, raf = 0;
  let voice = null, soundOn = true, loopOn = true, stopSound = null;

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return m + ':' + s.toFixed(2).padStart(5, '0');
  }
  function updateUI() {
    document.getElementById('time').textContent = fmt(t);
    const scrub = document.getElementById('scrub');
    if (document.activeElement !== scrub) scrub.value = String(t);
    document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
  }
  function drawAt(time) {
    t = Math.max(0, Math.min(DURATION, time));
    explainer(ctx, W, H_, t);
    updateUI();
  }
  function restartSound() {
    if (stopSound) { stopSound(); stopSound = null; }
    if (soundOn && playing) stopSound = window.SOUND.live(scoreSound, t, { voiceover: true });
  }
  function pause() {
    playing = false;
    cancelAnimationFrame(raf);
    if (voice) voice.pause();
    if (stopSound) { stopSound(); stopSound = null; }
    updateUI();
  }
  function play() {
    if (!voice && t >= DURATION - 0.05) t = 0;
    playing = true;
    if (voice) {
      if (voice.currentTime >= (voice.duration || DURATION) - 0.05) voice.currentTime = 0;
      voice.play();
      t = voice.currentTime || 0;
    }
    restartSound();
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
    updateUI();
  }
  function tick(ts) {
    if (!playing) return;
    if (voice) {
      t = voice.currentTime || 0;
      if (voice.ended) {
        if (loopOn) {
          voice.currentTime = 0;
          voice.play();
          t = 0;
          restartSound();
        } else { drawAt(DURATION); pause(); return; }
      }
    } else {
      const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000));
      last = ts;
      t += dt;
      if (t >= DURATION) {
        if (loopOn) { t = 0; restartSound(); }
        else { drawAt(DURATION); pause(); return; }
      }
    }
    explainer(ctx, W, H_, t);
    updateUI();
    raf = requestAnimationFrame(tick);
  }
  function loadVoice(file) {
    if (!file) return;
    pause();
    if (voice) { voice.pause(); if (voice.src) URL.revokeObjectURL(voice.src); }
    voice = new Audio();
    voice.preload = 'auto';
    voice.src = URL.createObjectURL(file);
    document.getElementById('vname').textContent = file.name;
    voice.addEventListener('ended', () => {
      if (!playing) return;
      if (loopOn) { voice.currentTime = 0; voice.play(); t = 0; restartSound(); }
      else { drawAt(Math.min(DURATION, voice.duration || DURATION)); pause(); }
    });
    drawAt(0);
  }

  document.getElementById('play').addEventListener('click', () => { playing ? pause() : play(); });
  document.getElementById('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    const btn = document.getElementById('sound');
    btn.textContent = soundOn ? 'Sound on' : 'Sound off';
    btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (!soundOn && stopSound) { stopSound(); stopSound = null; }
    if (soundOn && playing) restartSound();
  });
  document.getElementById('loop').addEventListener('change', (e) => { loopOn = e.target.checked; });
  document.getElementById('file').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) loadVoice(f); });
  const scrub = document.getElementById('scrub');
  scrub.max = String(DURATION);
  scrub.addEventListener('input', () => {
    const v = Number(scrub.value);
    if (voice) { try { voice.currentTime = Math.min(v, voice.duration || v); } catch (e) { /* not ready */ } }
    drawAt(v);
    if (playing) restartSound();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); }
  });
  const stage = document.getElementById('stage');
  window.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drop'); });
  window.addEventListener('dragleave', () => stage.classList.remove('drop'));
  window.addEventListener('drop', (e) => {
    e.preventDefault(); stage.classList.remove('drop');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadVoice(f);
  });

  window.seek = drawAt;
  window.DURATION = DURATION;
  window.scoreSound = scoreSound;
  window.explainer = explainer;
  window.BEATS = BEATS;

  const specs = [
    '400 66px "Permanent Marker"', '400 92px "Permanent Marker"', '400 150px "Permanent Marker"',
    '400 48px "Permanent Marker"', '700 32px "Kalam"', '700 40px "Kalam"', '700 36px "Kalam"', '700 30px "Kalam"',
  ];
  const sample = 'AaZz09 SRC L3 L4 £0 17 4.25 ONLY WHAT YOU CAN SEE AGENT BUILD';
  Promise.all(specs.map((f) => document.fonts.load(f, sample))).then(() => document.fonts.ready).then(() => {
    [5.8, 11.6, 12.2, 20.6, 27.4, 35.2, 36.0, 42.2, 50, 64.4, 70.6].forEach((tt) => explainer(ctx, W, H_, tt));
    drawAt(0);
    document.body.dataset.ready = '1';
  }).catch(() => { drawAt(0); document.body.dataset.ready = '1'; });
})();

</script>
